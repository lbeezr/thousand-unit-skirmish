<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc"><title id="title">Vaelora pregame lobby state storyboard</title><desc id="desc">Six schematic states connect the selected client materials to actual lobby state meanings. Plain map labels, team square and diamond marks, confirmed readiness, pending work, real rejection and reconnecting are retained. This is design backing, not a browser capture.</desc><style>.h{font:26px Georgia,serif;fill:#f3eddf}.small{font:15px system-ui,sans-serif;fill:#bcc9bd}.text{font:16px system-ui,sans-serif;fill:#f3eddf}.label{font:13px system-ui,sans-serif;fill:#bcc9bd}</style><rect width="1440" height="1050" fill="#0b201c"/><text x="38" y="42" font-size="14" font-family="system-ui,sans-serif" fill="#d0b376">VAELORA · PREGAME LOBBY · WORKING STATE STUDY · 14 OCTOBER 2026</text><text x="38" y="93" font-size="39" font-family="Georgia,serif" fill="#f3eddf">Quiet planning. Clear commitments.</text><text x="38" y="126" class="small">Selected pine, parchment and brass; less ornament than the homepage. State follows the server.</text>
