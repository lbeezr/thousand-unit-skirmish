<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc"><title id="title">Vaelora result and return storyboard</title><desc id="desc">Six schematic panels connect a calm, readable result to the existing Obsidian command instrument and Vaelora return paths. Actual outcome, reason and available host or guest actions come first. Recap details remain optional. No forced delay, new result cue or fictional battle history is introduced.</desc><style>.head{font:25px Georgia,serif;fill:#f3eddf}.text{font:18px Arial,sans-serif;fill:#f2f4ee}.muted{font:15px Arial,sans-serif;fill:#b2c1c5}.small{font:13px Arial,sans-serif;fill:#b2c1c5}</style><rect width="1440" height="1130" fill="#0b201c"/><text x="38" y="43" font-family="Arial,sans-serif" font-size="14" fill="#d0b376">VAELORA · RESULT / RETURN · WORKING STATE STUDY · 14 OCTOBER 2026</text><text x="38" y="94" font-family="Georgia,serif" font-size="38" fill="#f3eddf">Explain the outcome. Leave room for the moment.</text><text x="38" y="127" class="muted">Approved Obsidian surfaces and type; plain reasons; familiar next actions. State changes drive the sequence.</text>
