<path d="M38 1012 H1394" stroke="#52634d"/><text x="38" y="1047" class="muted">Trigger: accepted result → same result after reconnect → existing reset or menu navigation. Rematch hides and clears the old result.</text><text x="38" y="1078" class="small">Schematic backing only. Native duration/resources/survivors remain unchanged; unavailable statistics stay unavailable. No game pixels claimed.</text><text x="38" y="1105" class="small">Panel 6 diagrams the transition; it is not a new screen. Immediate-match copy is an illustrative fixture, not an AI completion or balance claim.</text></svg>
