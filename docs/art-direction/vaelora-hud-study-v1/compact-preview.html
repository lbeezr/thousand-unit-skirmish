<h1>Vaelora · three HUD directions for review</h1>
<p>Code-authored proposals using current icons/cursors on actual captured snow terrain. The proposed HUD is not integrated.</p>
<div class="grid">
<figure><img src="previews/journal-snow-blocked.png" alt="Field journal proposal"><figcaption><strong>01 · Field journal</strong><span class="tradeoff">Parchment and botanical ink. Pale icons keep dark plates.<br>Tradeoff: light panels carry more visual weight.</span></figcaption></figure>
<figure><img src="previews/wood-snow-blocked.png" alt="Oak and iron proposal"><figcaption><strong>02 · Oak and iron</strong><span class="tradeoff">Timber, brass and dark tool plates match existing cursors.<br>Tradeoff: thick frames can obscure terrain.</span></figcaption></figure>
<figure><img src="previews/map-snow-blocked.png" alt="Quiet wayfinder proposal"><figcaption><strong>03 · Quiet wayfinder</strong><span class="tradeoff">Matte map green, pale ink, restrained magical route arcs.<br>Tradeoff: ornament must stay distinct from target markers.</span></figcaption></figure>
</div><p class="note">Presentation thumbnails. Use the full-size PNGs and native-size asset board to assess text and badges. Direction choice remains open.</p>
