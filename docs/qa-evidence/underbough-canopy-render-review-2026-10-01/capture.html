<!doctype html><html><head><base href="/"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head><body><script type="module">
import * as THREE from 'three';
import {addObstacleEnvironmentSprites,setForestSpriteStock,createEnvironmentSpriteInstances} from '/src/environment-art.mjs';
import {CAMERA_VIEW_DIRECTION} from '/src/camera-controls.mjs';
const map=await(await fetch('/maps/underbough-rootways.json')).json(),original=JSON.stringify(map),objects=[];
const slots=addObstacleEnvironmentSprites(map,map.width/2,map.height/2,m=>objects.push(m));
const slot=[...slots.values()].find(s=>s.family==='underbough-root-oak');if(!slot?.atlas)throw Error('No Root Oak atlas slot');
const zero=new THREE.Matrix4().makeScale(0,0,0);for(const m of objects)for(let i=0;i<m.count;i++)m.setMatrixAt(i,zero);
for(const m of objects)m.instanceMatrix.needsUpdate=true;
setForestSpriteStock(slot,6);
const atlasScene=new THREE.Scene();atlasScene.background=new THREE.Color('#33382b');atlasScene.add(slot.mesh);
const direct=createEnvironmentSpriteInstances('underbough-root-oak',3.1,3.07655,[{x:slot.x,z:slot.z,scale:slot.scale,flip:slot.flip,yaw:slot.yaw}]);
const directScene=new THREE.Scene();directScene.background=new THREE.Color('#33382b');directScene.add(direct);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(750,750);document.body.append(renderer.domElement);
const camera=new THREE.OrthographicCamera(-2,2,2,-2,.1,100),target=new THREE.Vector3(slot.x,1.1,slot.z);
camera.position.copy(target).add(new THREE.Vector3(...CAMERA_VIEW_DIRECTION).normalize().multiplyScalar(12));camera.lookAt(target);
const textures=[slot.mesh.material.map,direct.material.map],deadline=Date.now()+15000;
while(textures.some(t=>!t.image?.complete||!t.image.naturalWidth)){if(Date.now()>deadline)throw Error('Missing tree texture');await new Promise(r=>setTimeout(r,50));}
async function save(name,data){const r=await fetch('/__save/'+name,{method:'POST',body:data});if(!r.ok)throw Error('Save '+r.status);}
renderer.render(atlasScene,camera);await save('root-oak-atlas.png',await new Promise(r=>renderer.domElement.toBlob(r)));
renderer.render(directScene,camera);await save('root-oak-individual.png',await new Promise(r=>renderer.domElement.toBlob(r)));

const stand=new THREE.Scene();stand.background=new THREE.Color('#33382b');objects.forEach(m=>stand.add(m));
camera.left=-8;camera.right=8;camera.top=8;camera.bottom=-8;camera.updateProjectionMatrix();
const scales=new Map([...slots.values()].map(s=>[s.cell,s.scale]));
for(const s of slots.values())setForestSpriteStock(s,6);
renderer.render(stand,camera);await save('forest-all-cell-canopies.png',await new Promise(r=>renderer.domElement.toBlob(r)));
const cohorts=new Map();for(const s of slots.values()){
 const key=Math.floor((s.cell%map.width)/2)+','+Math.floor(Math.floor(s.cell/map.width)/2);
 const list=cohorts.get(key)||[];list.push(s);cohorts.set(key,list);
}
for(const list of cohorts.values()){
 const rank=s=>((Math.imul(s.cell+map.terrainSeed,1664525)+1013904223)>>>0);
 list.sort((a,b)=>rank(a)-rank(b));
 for(let i=0;i<list.length;i++){list[i].scale=scales.get(list[i].cell)*(i===0?1:.42);setForestSpriteStock(list[i],6);}
}
renderer.render(stand,camera);await save('forest-canopy-cohort-study.png',await new Promise(r=>renderer.domElement.toBlob(r)));
for(const s of slots.values()){s.scale=scales.get(s.cell);setForestSpriteStock(s,6);}
if(JSON.stringify(map)!==original)throw Error('Map changed');
await save('proof.json',JSON.stringify({cell:slot.cell,family:slot.family,requestedStock:6,atlasRect:Array.from(slot.atlas.rects.array.slice(slot.index*4,slot.index*4+4)),expectedFullRect:slot.atlas.frameRects.full,sourceTextures:textures.map(t=>t.image.src.split('/').at(-1)),sameRootScaleFlipYaw:true,mapUnchanged:true},null,2));window.__renderDone=true;
</script></body></html>
