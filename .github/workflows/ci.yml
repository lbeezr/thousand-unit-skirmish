name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Run full CPU suite or one explicitly scoped test lane'
        type: choice
        default: full
        options: [full, fast, simulation, visual, performance]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'full' || inputs.lane == ''
    name: Verify Node 24 project (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run project checks and scenarios
        run: npm test -- --shard=${{ matrix.shard }}/3 --report=${{ runner.temp }}/ci-shard-${{ matrix.shard }}.json

      - name: Retain scoped check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-shard-${{ matrix.shard }}-evidence
          path: ${{ runner.temp }}/ci-shard-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Pack Railway release
        if: matrix.shard == 1
        run: npm run release:pack

  lane:
    if: github.event_name == 'workflow_dispatch' && inputs.lane != 'full' && inputs.lane != ''
    name: Requested ${{ inputs.lane }} lane
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run requested lane
        env:
          TEST_LANE: ${{ inputs.lane }}
        run: node scripts/ci.mjs --lane="$TEST_LANE" --report="${{ runner.temp }}/test-lane.json"
      - name: Retain scoped check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.lane }}-lane-evidence
          path: ${{ runner.temp }}/test-lane.json
          if-no-files-found: error
