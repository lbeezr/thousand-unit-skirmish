name: Staging roster audio capture

on:
  workflow_dispatch:
    inputs:
      subset:
        description: Bounded ordinary audio subset, or all subsets sequentially in one owned room
        type: string
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: staging-roster-audio
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Validate explicit bounded plan and CPU contracts
        id: plan
        env:
          SUBSET: ${{ inputs.subset }}
        run: |
          node --test scripts/renderer-roster-audio-capture.test.mjs scripts/renderer-roster-audio-batch.test.mjs
          node scripts/renderer-roster-audio-staging.mjs --matrix "$SUBSET" > "${{ runner.temp }}/subsets.json"
  capture:
    needs: plan
    runs-on: ubuntu-latest
    # Fourteen independent 300-second caps in a single owned room, plus setup
    # and artifact upload. A lost entry/deadline stops the batch immediately.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Establish normal-sandbox WebGL2 capability once
        env:
          PREFLIGHT: ${{ runner.temp }}/roster-preflight
        run: |
          test "$(id -u)" -gt 0
          node scripts/renderer-qualification.mjs --preflight "$PREFLIGHT"
      - name: Record public staging through normal gameplay in one owned room
        env:
          SUBSET: ${{ inputs.subset }}
          REVISION: ${{ github.sha }}
          EVIDENCE: ${{ runner.temp }}/roster-audio
          PREFLIGHT: ${{ runner.temp }}/roster-preflight/preflight.json
        run: node scripts/renderer-roster-audio-staging.mjs "$SUBSET" "$REVISION" "$EVIDENCE" "$PREFLIGHT"
      - name: Retain each completed recording, partial coverage and safe receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roster-audio-${{ inputs.subset }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/roster-audio/
            ${{ runner.temp }}/roster-preflight/preflight.json
          retention-days: 1
          if-no-files-found: warn
